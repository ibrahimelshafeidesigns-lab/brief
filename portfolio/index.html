/* Layout: full-height picture cover, then pill tabs over a grid of project cards; a card opens a full-screen swipe gallery. */
:root{--bg:#f4f1ec;--ink:#1f1d1a;--soft:#6a655d;--panel:#fbf9f6;--line:#e2dcd2;--accent:#a8603d;--on:#fff;--display:"Sora","Segoe UI",system-ui,sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-block:10px;background:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;padding-block:8px 40px}
.card{position:relative;display:block;width:100%;aspect-ratio:4/3.4;padding:0;border:0;border-radius:18px;overflow:hidden;background:var(--line);cursor:pointer;text-align:left;font:inherit}
.card[hidden]{display:none}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,rgba(12,10,8,.85))}
.c{position:absolute;z-index:1;left:16px;right:16px;bottom:14px;color:#fff;display:grid;gap:2px}
.c em{font-style:normal;font-size:13.5px;line-height:1.4;color:#efe9df;margin-top:3px}
.c b{font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:-.01em}.c small{font-size:14px;color:#e6dfd4}
.n{position:absolute;z-index:1;top:12px;right:12px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:rgba(15,13,11,.55);backdrop-filter:blur(8px)}
@media (hover:hover){.card:hover img{transform:scale(1.04)}}
footer{border-top:1px solid var(--line);padding-block:30px 44px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
.phone{font-family:var(--display);font-size:28px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;user-select:all}
.wa{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#1f7a4d;color:#fff;font-weight:600;font-size:16px;text-decoration:none}
.links{display:flex;gap:8px}.links a{padding:9px 16px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
#view{position:fixed;inset:0;z-index:20;background:#0d0c0b;color:#fff;display:flex;flex-direction:column}
#view[hidden]{display:none}
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh b{font-family:var(--display);font-weight:500;font-size:18px;display:block}.vh small{color:#b9b2a6;font-size:13px}
#x{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
#slides{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#slides::-webkit-scrollbar{display:none}
#slides div{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;min-width:0}
#slides img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#vb{margin:0 auto;max-width:42em;padding:12px 20px 0;font-size:15px;line-height:1.5;color:#e6dfd4;text-align:center}
#count{text-align:center;padding-top:10px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));font-size:13px;color:#b9b2a6;font-variant-numeric:tabular-nums}
.arrow{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;display:none}
@media (hover:hover) and (min-width:720px){.arrow{display:block}.tabs{grid-template-columns:repeat(6,auto);justify-content:start}.tabs button{padding:0 18px}}
#prev{left:16px}#next{right:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

ens" data-p="11" aria-label="Open Mohandiseen, Kitchen"><img src="img/p11-01.jpg" alt="Kitchen in Mohandiseen" loading="lazy"><span class="n">3 photos</span><span class="c"><b>Mohandiseen</b><small>Kitchen</small><em>A compact kitchen in cream and wood, with a lit backsplash.</em></span></button><button class="card" data-tab="tv" data-p="12" aria-label="Open TV Units, Built by our workshop"><img src="img/p12-01.jpg" alt="Built by our workshop in TV Units" loading="lazy"><span class="n">3 photos</span><span class="c"><b>TV Units</b><small>Built by our workshop</small><em>Floating and standing TV units, in wood and in clean white.</em></span></button><button class="card" data-tab="shoe" data-p="13" aria-label="Open Shoe Cabinet, Built by our workshop"><img src="img/p13-02.jpg" alt="Built by our workshop in Shoe Cabinet" loading="lazy"><span class="c"><b>Shoe Cabinet</b><small>Built by our workshop</small><em>A slim shoe cabinet with cream doors under a solid-look wood top.</em></span></button></main>

const $=s=>document.querySelector(s);
function showTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));document.querySelectorAll('.card').forEach(c=>{c.hidden=c.dataset.tab!==t})}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{showTab(b.dataset.t);const n=$('.tabs');if(n.getBoundingClientRect().top<=1)n.scrollIntoView()}));
const S=$('#slides');
function count(){const n=S.children.length,i=Math.round(S.scrollLeft/(S.clientWidth||1));$('#count').textContent=n>1?(i+1)+' / '+n:''}
function openP(k){const p=P[k];$('#vt').textContent=p.t;$('#vr').textContent=p.r;$('#vb').textContent=p.b;S.innerHTML=p.i.map(f=>'<div><img src="'+f+'" alt="'+p.r+' in '+p.t+'"></div>').join('');$('#view').hidden=false;document.body.style.overflow='hidden';S.scrollLeft=0;count();$('#x').focus()}
