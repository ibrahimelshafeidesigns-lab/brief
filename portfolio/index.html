<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ibrahim &amp; Ali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* The same look as the kitchen links: white, warm hairlines, ink, gold, Cormorant Garamond over IBM Plex, sharp corners. One light look only.
   Layout: full-height picture cover, then tabs over a grid of project cards; a card opens a full-screen swipe gallery. */
:root{color-scheme:light;--bg:#ffffff;--bg-2:#f7f6f3;--ink:#1b1b19;--ink-2:#45443f;--muted:#6f6c65;--line:#e9e6e0;--gold:#b0925f;--gold-soft:#f6f1e7;--sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--serif:"Cormorant Garamond","IBM Plex Sans Arabic",Georgia,serif}
body{background:var(--bg);color:var(--ink);font:300 17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hero{position:relative;height:min(84vh,780px);min-height:440px;overflow:hidden;background:#2a2622}
.hero img{width:100%;height:112%;object-fit:cover;display:block;will-change:transform}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,11,.18) 0%,rgba(15,13,11,0) 40%,rgba(15,13,11,.72) 100%)}
.hero div{position:absolute;z-index:1;left:0;right:0;bottom:0;max-width:1240px;margin:auto;color:#fff;padding-block:30px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(54px,12vw,124px);line-height:1;letter-spacing:.005em}
.hero span{display:block;width:56px;height:1px;background:var(--gold);margin:14px 0}
.hero p{margin:0;font-size:clamp(15px,2.2vw,18px);line-height:1.6;max-width:30em;color:#f1ece3}
.wrap{max-width:1240px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 4px;padding-block:6px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{position:relative;font:500 11px/1.25 var(--sans);letter-spacing:.1em;text-transform:uppercase;white-space:normal;min-height:40px;padding:0 2px;border:0;background:none;color:var(--muted);cursor:pointer;transition:color .3s}
.tabs button i{position:absolute;left:18%;right:18%;bottom:5px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] i{transform:scaleX(1)}
button:focus-visible,a:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:30px 18px;padding-block:22px 44px}
.card{display:block;width:100%;padding:0;border:0;border-radius:2px;background:none;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .8s}
.card[hidden]{display:none}
.motion .card.wait{transform:translateY(26px);opacity:.25}
.pic{position:relative;display:block;aspect-ratio:4/3.2;overflow:hidden;border-radius:18px;background:var(--bg-2)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card[data-tab="bathrooms"] .pic img{object-position:50% 82%}
.card[data-p="51"] .pic img,.card[data-p="52"] .pic img{object-position:50% 100%}
.c{display:grid;gap:1px;padding:12px 2px 0}
.c b{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.15}
.c small{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.c em{font-style:normal;font-size:15px;line-height:1.55;color:var(--ink-2);margin-top:5px}
.n{position:absolute;z-index:1;top:10px;right:10px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--ink);background:rgba(255,255,255,.9)}
@media (hover:hover){.card:hover .pic img{transform:scale(1.045)}}
.more{padding-block:4px 40px;display:flex;justify-content:center}
#nextTab{display:flex;align-items:baseline;gap:14px;min-height:56px;padding:10px 26px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;transition:border-color .3s}
#nextTab small{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#nextTab b{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1}
#nextTab span{font-size:20px;color:var(--gold);transition:transform .35s}
@media (hover:hover){#nextTab:hover{border-color:var(--gold)}#nextTab:hover span{transform:translateX(4px)}}
footer{border-top:1px solid var(--line);padding-block:30px 44px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;justify-content:space-between}
.wa{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:2px;background:var(--ink);color:#fff;font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.links{display:flex;gap:18px}.links a{color:var(--ink-2);text-decoration:none;font-size:13px;letter-spacing:.06em;border-bottom:1px solid var(--gold);padding-bottom:2px}
#view{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;animation:fade .35s ease both}
#view[hidden]{display:none}
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.vh b{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.1;display:block}.vh small{color:var(--gold);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
#x{flex:none;width:42px;height:42px;border-radius:2px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;cursor:pointer}
#slides{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--bg-2)}
#slides::-webkit-scrollbar{display:none}
#slides div{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;min-width:0}
#slides img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:18px;will-change:transform,opacity}
#vb{margin:0 auto;max-width:42em;padding:12px 20px 0;font-size:15px;line-height:1.55;color:var(--ink-2);text-align:center}
#count{text-align:center;padding-top:6px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
.arrow{position:absolute;top:50%;width:44px;height:44px;border-radius:2px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--ink);font-size:20px;cursor:pointer;display:none}
@media (hover:hover) and (min-width:720px){.arrow{display:block}.tabs{grid-template-columns:repeat(6,auto);justify-content:start;gap:0 26px}.tabs button{padding:0 2px}.tabs button i{left:0;right:0}}
#prev{left:16px}#next{right:16px}
.c small,.vh small{display:none}
#intro{position:fixed;inset:0;z-index:50;background:#141210;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease 1.5s,visibility 0s linear 2.5s}
#intro.gone{opacity:0;visibility:hidden}
#intro b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(40px,9vw,72px);line-height:1;color:#fff;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .1s both}
#intro i{display:block;width:0;height:1px;background:var(--gold);margin:16px auto 0;animation:line 1s ease .6s forwards}
@keyframes line{to{width:64px}}
.hero figure{position:absolute;inset:0;margin:0;will-change:transform}
.hero figure img{position:absolute;inset:0;width:100%;height:112%;object-fit:cover;opacity:0;transform:scale(1.1);transition:opacity 1.6s ease,transform 8s linear}
.hero figure img.on{opacity:1;transform:scale(1)}
.hero div{animation:none}
.hero h1{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) 1.7s both}
.hero div span{transform-origin:left;animation:grow 1s ease 2.1s both}
.hero p{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) 2.3s both}
.hero em{display:block;margin-top:14px;font-style:normal;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#e6d8bd;transition:opacity .6s;animation:rise 1s ease 2.6s both}
.hero em.fade{opacity:0}
.hero .cue{position:absolute;z-index:1;left:50%;bottom:0;width:1px;height:40px;margin:0;background:linear-gradient(var(--gold),transparent);transform-origin:top;animation:drip 2.4s ease-in-out 3s infinite both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes drip{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:26px 0 22px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(36px,8vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.stats small{display:block;margin-top:6px;font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.stats div{opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.stats.in div{opacity:1;transform:none}.stats.in div:nth-child(2){transition-delay:.12s}.stats.in div:nth-child(3){transition-delay:.24s}
.pic{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pic::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .4s}
@media (hover:hover){.card:hover .pic::after{opacity:1}}
.card:active .pic{transform:scale(.97)}
.grid.swipe-l .card:not([hidden]){animation:inR .5s cubic-bezier(.2,.7,.2,1) both}
.grid.swipe-r .card:not([hidden]){animation:inL .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes inR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
#bar{height:2px;background:var(--line);margin:8px auto 0;max-width:220px;overflow:hidden}
#bar i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#slides div img{animation:pop .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#intro{display:none}.hero figure img{transition:none}.stats div{opacity:1;transform:none}.cue{display:none}}
@keyframes rise{from{transform:translateY(22px);opacity:.1}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<div id="intro" aria-hidden="true"><div><b>Ibrahim &amp; Ali</b><i></i></div></div><div class="hero"><figure id="heroimg"></figure><div><h1>Ibrahim &amp; Ali</h1><span></span><p>Kitchens, wardrobes, bathrooms and full homes, designed and built by our own workshop in Egypt.</p><em id="cap"></em></div><span class="cue" aria-hidden="true"></span></div>

room, with dark cabinets, warm wood accents and a row of pendant lights.</em></span></button><button class="card" data-tab="bedrooms" data-p="3" aria-label="Open Ghazala Bay, Playa, Bedroom"><span class="pic"><img src="img/p03-01.jpg" alt="Bedroom in Ghazala Bay, Playa" loading="lazy"></span><span class="c"><b>Ghazala Bay, Playa</b><small>Bedroom</small><em>A calm, light bedroom with soft wood tones and a floating dressing shelf.</em></span></button><button class="card" data-tab="kitchens" data-p="4" aria-label="Open Settlement, Kitchen"><span class="pic"><img src="img/p04-02.jpg" alt="Kitchen in Settlement" loading="lazy"><span class="n">4 photos</span></span><span class="c"><b>Settlement</b><small>Kitchen</small><em>Wood and cream cabinets around a tall fridge column, with a lit backsplash.</em></span></button><button class="card" data-tab="kitchens" data-p="6" aria-label="Open Mokattam, Kitchen"><span class="pic"><img src="img/p06-01.jpg" alt="Kitchen in Mokattam" loading="lazy"><span class="n">3 photos</span></span><span class="c"><b>Mokattam</b><small>Kitchen</small><em>Dark cabinets under wood uppers, warmed by lighting beneath the wall units.</em></span></button><button class="card" data-tab="bedrooms" data-p="7" aria-label="Open October Ashgar City, Bedrooms"><span class="pic"><img src="img/p07-01.jpg" alt="Bedrooms in October Ashgar City" loading="lazy"><span class="n">4 photos</span></span><span class="c"><b>October Ashgar City</b><small>Bedrooms</small><em>Built furniture in walnut: wardrobes, bed, dresser and bedside units.</em></span></button><button class="card" data-tab="bedrooms" data-p="8" aria-label="Open Al Shorouk City, Bedroom"><span class="pic"><img src="img/p08-01.jpg" alt="Bedroom in Al Shorouk City" loading="lazy"><span class="n">2 photos</span></span><span class="c"><b>Al Shorouk City</b><small>Bedroom</small><em>A wood feature wall holding the TV and dressing table, with built-in wardrobes.</em></span></button><button class="card" data-tab="kitchens" data-p="9" aria-label="Open October Gardens, Kitchen"><span class="pic"><img src="img/p09-01.jpg" alt="Kitchen in October Gardens" loading="lazy"><span class="n">3 photos</span></span><span class="c"><b>October Gardens</b><small>Kitchen</small><em>A wood kitchen with a lit glass cabinet and black counters.</em></span></button><button class="card" data-tab="living" data-p="10" aria-label="Open Beverly Hills, Living"><span class="pic"><img src="img/p10-01.jpg" alt="Living in Beverly Hills" loading="lazy"><span class="n">3 photos</span></span><span class="c"><b>Beverly Hills</b><small>Living</small><em>A walnut wall unit built around a niche, with a matching daybed.</em></span></button><button class="card" data-tab="tv" data-p="12" aria-label="Open TV Units, Built by our workshop"><span class="pic"><img src="img/p12-01.jpg" alt="Built by our workshop in TV Units" loading="lazy"><span class="n">3 photos</span></span><span class="c"><b>TV Units</b><small>Built by our workshop</small><em>Floating and standing TV units, in wood and in clean white.</em></span></button><button class="card" data-tab="shoe" data-p="13" aria-label="Open Shoe Cabinet, Built by our workshop"><span class="pic"><img src="img/p13-02.jpg" alt="Built by our workshop in Shoe Cabinet" loading="lazy"></span><span class="c"><b>Shoe Cabinet</b><small>Built by our workshop</small><em>A slim shoe cabinet with cream doors under a solid-look wood top.</em></span></button><button class="card" data-tab="bedrooms" data-p="14" aria-label="Open Mokattam, Dressing room"><span class="pic"><img src="img/p14-01.jpg" alt="Dressing room in Mokattam" loading="lazy"><span class="n">5 photos</span></span><span class="c"><b>Mokattam</b><small>Dressing room</small><em>A wall of tall wood wardrobes behind smoked glass doors with lit hanging rails and drawers, next to a lit standing mirror.</em></span></button><button class="card" data-tab="living" data-p="15" aria-label="Open Heliopolis, Office"><span class="pic"><
