:root{color-scheme:light;--bg:#ffffff;--bg-2:#f7f6f3;--ink:#1b1b19;--ink-2:#45443f;--muted:#6f6c65;--line:#e9e6e0;--gold:#b0925f;--gold-soft:#f6f1e7;--sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--serif:"Cormorant Garamond","IBM Plex Sans Arabic",Georgia,serif}

.hero span{display:block;width:56px;height:1px;background:var(--gold);margin:14px 0}
.hero p{margin:0;font-size:clamp(15px,2.2vw,18px);line-height:1.6;max-width:30em;color:#f1ece3}
.wrap{max-width:1240px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 6px;padding-block:6px;background:var(--bg);border-bottom:1px solid var(--line)}

#prev{left:16px}#next{right:16px}
.c small,.vh small{display:none}
@keyframes rise{from{transform:translateY(22px);opacity:.1}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
