<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17263a">
<title>مصمم الورشة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><span class="mark">م</span>مصمم الورشة</div>
    <button class="proto" id="newchat" hidden>تصميم جديد</button>
  </header>
  <main id="main"></main>
  <div class="composer" id="composer" hidden>
    <button class="iconbtn mic" id="mic" aria-label="اتكلم" title="اتكلم بدل ما تكتب">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3" fill="none"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none"/></svg>
    </button>
    <input id="prompt" type="text" placeholder="عايز تعمل إيه؟" autocomplete="off">
    <button class="iconbtn send" id="send" aria-label="ابعت">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h13M13 6l6 6-6 6" fill="none"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" data-tab="design" aria-selected="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z" fill="none"/></svg>تصميم</button>
    <button role="tab" data-tab="jobs" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2" fill="none"/><path d="M8 9h8M8 13h8M8 17h5" fill="none"/></svg><span>الشغل<span class="badge" id="jobcount">0</span></span></button>
    <button role="tab" data-tab="rules" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l14-14 4 4L7 21H3z M7 13l2 2M10 10l2 2M13 7l2 2" fill="none"/></svg>قواعد الورشة</button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
